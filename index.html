<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="STATECAST" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1976d2" />
    <title>STATECAST</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style></style>
  </head>
  <body class="bg-light">
    <div class="toast-container position-fixed top-0 end-0 p-3">
      <div class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
          <i class="fa-solid fa-podcast"></i>
          <strong class="me-auto toast-title">Bootstrap</strong>
          <small class="toast-caption">11 mins ago</small>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
        <div class="toast-body d-flex align-items-center gap-1">
          Hello, world! This is a toast message.
        </div>
      </div>
    </div>
    <div id="nav"></div>

    <div class="workspace">
      <div id="extra"></div>
      <div id="app" class="row"></div>
    </div>

    <footer>
      <div>
        <span style="color: rgb(25, 118, 210)">STATE</span><b>CAST</b> &copy;
      </div>

      <div class="desktop">
        A Vanilla<b><em>TS</em></b> web application
      </div>
      <div class="spacer"></div>
      <div>
        <img
          src="/favicon.svg"
          alt="GitHub"
          style="width: 16px; height: 16px; display: inline-block"
        />
        Check out
        <a target="_blank" class="storybook-link" href="#">the Storybook</a>
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </div>
    </footer>

    <div
      class="offcanvas offcanvas-start"
      tabindex="-1"
      id="offcanvas"
      aria-labelledby="offcanvasLabel"
    >
      <div class="offcanvas-header p-1">
        <b class="offcanvas-title p-1" data-display="title" id="offcanvasLabel">
          Offcanvas
        </b>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>

      <div class="offcanvas-body" id="offbody">
        Content for the offcanvas goes here. You can place just about any
        Bootstrap component or custom elements here.
      </div>
    </div>

    <!-- Audio Player -->
    <div id="audio-player-container">
      <!-- begin -->

      <!-- end  -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/store.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
